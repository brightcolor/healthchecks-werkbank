# Erweiterungen, die der Bau in jeder Sprache einsetzt (sprache.py bauen).
# en ist der Anker in Healthchecks, de der Ersatz. Greift ein Eintrag nicht, bricht der
# Bau ab: Die Vorlagen der Werkbank nutzen die Filter zustand, art und rolle sowie die Tags
# werkbank_mail und werkbank_name. Der Katalog läuft danach und sieht die Vorlagen mit diesen Ersetzungen.

[[quelltext]]
datei = "hc/front/templatetags/hc_extras.py"
anzahl = 1
en = '''
register = template.Library()
'''
de = '''
register = template.Library()


@register.filter
def zustand(status: str) -> str:
    """Zustand eines Checks in Worten der Werkbank (WERKBANK_ZUSTAENDE), sonst unverändert."""
    return getattr(settings, "WERKBANK_ZUSTAENDE", {}).get(status, status)


@register.filter
def art(kanal) -> str:
    """Art einer Integration in Worten der Werkbank (WERKBANK_ARTEN), sonst der Name aus Healthchecks."""
    return getattr(settings, "WERKBANK_ARTEN", {}).get(kanal.kind, kanal.get_kind_display())


@register.filter
def rolle(mitglied) -> str:
    """Rolle eines Mitglieds in Worten der Werkbank (WERKBANK_ROLLEN), sonst der Name aus Healthchecks."""
    return getattr(settings, "WERKBANK_ROLLEN", {}).get(mitglied.role, mitglied.get_role_display())


@register.simple_tag
def werkbank_mail(name: str) -> str:
    """Wert einer Mail-Einstellung der Werkbank, etwa WB_MAIL_IMPRESSUM_URL; leer, wenn nicht gesetzt."""
    return getattr(settings, name, "")


@register.simple_tag
def werkbank_name() -> str:
    """SITE_NAME für Stellen in Versalien. Enthält er einen Namen aus WERKBANK_MARKEN, steht er in
    <span class="bc-brand"> und bleibt so geschrieben, wie er eingetragen ist. format_html und
    escape importiert hc_extras selbst."""
    name = settings.SITE_NAME
    if any(marke.casefold() in name.casefold() for marke in getattr(settings, "WERKBANK_MARKEN", [])):
        return format_html('<span class="bc-brand">{}</span>', name)
    return escape(name)
'''

