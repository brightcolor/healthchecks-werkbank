# Texte im Code von Healthchecks: Dauern, Seitentitel, Datumsformate im Browser, Sätze in
# Skripten, Meldungen und Formularfehler in Python, Fehlertexte der Integrationen.
# Antworten der API (hc/api/views.py) und Protokollzeilen bleiben englisch, Skripte werten sie aus.

# --- Dauern (hc/lib/date.py) ----------------------------------------------------------------

