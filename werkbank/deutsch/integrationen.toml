anzahl = 1
en = '''
Execute when a check goes <span class="label-down">down</span>'''
de = '''
Ausführen, wenn ein Check <span class="label-down">ausfällt</span>'''

[[quelltext]]
datei = "hc/integrations/shell/templates/add_shell.html"
anzahl = 1
en = '''
Execute when a check goes <span class="label-up">up</span>'''
de = '''
Ausführen, wenn ein Check <span class="label-up">wieder in Ordnung</span> ist'''

[[quelltext]]
datei = "hc/integrations/shell/templates/add_shell.html"
anzahl = 1
en = '''
You can use the below placeholders in the command.
                    {{ site_name }} will replace the placeholders
                    with the correct values.'''
de = '''
Diese Platzhalter kannst du im Befehl nutzen. {{ site_name }} setzt die passenden Werte ein.'''

[[quelltext]]
datei = "hc/integrations/shell/templates/add_shell.html"
anzahl = 1
en = '''
Current UTC time in ISO8601 format.<br />
                            Example: "{% now_isoformat %}"'''
de = '''
Aktuelle Zeit in UTC im Format ISO 8601.<br />
                            Beispiel: „{% now_isoformat %}“'''

[[quelltext]]
datei = "hc/integrations/shell/templates/add_shell.html"
anzahl = 1
en = '''
