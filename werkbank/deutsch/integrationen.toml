    you can set up {{ site_name }} to post status updates directly to an
    appropriate Telegram user, group or channel.'''
de = '''
Nutzt dein Team <a href="https://telegram.org/">Telegram</a>, schickt {{ site_name }} Statusmeldungen direkt an einen Telegram-Nutzer, eine Gruppe oder einen Kanal.'''

[[quelltext]]
datei = "hc/integrations/telegram/templates/add_telegram.html"
anzahl = 1
en = '''
<strong>Groups:</strong> If you want notifications sent to a group, start by inviting
                <a href="https://t.me/{{ bot_name }}">{{ bot_name }}</a>
                to the group. The bot will get added as a member with no access to
                group messages.'''
de = '''
<strong>Gruppen:</strong> Sollen Benachrichtigungen in eine Gruppe gehen, lade zuerst <a href="https://t.me/{{ bot_name }}">{{ bot_name }}</a> in die Gruppe ein. Der Bot wird Mitglied, liest aber keine Nachrichten der Gruppe.'''

[[quelltext]]
datei = "hc/integrations/telegram/templates/add_telegram.html"
anzahl = 1
en = '''
<strong>Direct messages:</strong> If you want notifications sent to yourself directly,
                start a conversation with
                <a href="https://t.me/{{ bot_name }}">{{ bot_name }}</a>.'''
de = '''
<strong>Direktnachrichten:</strong> Sollen Benachrichtigungen direkt an dich gehen, starte eine Unterhaltung mit <a href="https://t.me/{{ bot_name }}">{{ bot_name }}</a>.'''

[[quelltext]]
datei = "hc/integrations/telegram/templates/add_telegram.html"
anzahl = 1
en = '''
<strong>Channels:</strong> If you want notifications sent to a Telegram channel,
                add <a href="https://t.me/{{ bot_name }}">{{ bot_name }}</a>
                to the channel's Administrators. Enable the "Post Messages" admin
                right, and disable all other admin rights.'''
de = '''
<strong>Kanäle:</strong> Sollen Benachrichtigungen in einen Telegram-Kanal gehen, mach <a href="https://t.me/{{ bot_name }}">{{ bot_name }}</a> zum Administrator des Kanals. Schalte das Admin-Recht „Post Messages“ ein und alle anderen Admin-Rechte aus.'''

[[quelltext]]
datei = "hc/integrations/telegram/templates/add_telegram.html"
anzahl = 1
en = '''
<p>Type <strong><code>/start</code></strong> command.
               If there are multiple bots in the group, type
               <strong><code>/start@{{ bot_name }}</code></strong> instead.'''
de = '''
<p>Schick den Befehl <strong><code>/start</code></strong>. Sind mehrere Bots in der Gruppe, schick stattdessen <strong><code>/start@{{ bot_name }}</code></strong>.'''

[[quelltext]]
datei = "hc/integrations/telegram/templates/add_telegram.html"
anzahl = 1
