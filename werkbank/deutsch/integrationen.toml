            <a href="https://github.com/healthchecks/healthchecks">open source</a>
            service for monitoring <strong>cron jobs</strong>, <strong>background processes</strong> and
            <strong>scheduled tasks</strong>. When {% site_name %} detects a problem, it can notify
            you by posting to a Google Chat space. To set up the Google Chat
            integration, please log into {{ site_name }}:'''
de = '''
ist ein kostenloser <a href="https://github.com/healthchecks/healthchecks">Open-Source</a>-Dienst zur Überwachung von <strong>Cron-Jobs</strong>, <strong>Hintergrundprozessen</strong> und <strong>geplanten Aufgaben</strong>. Erkennt {% site_name %} ein Problem, meldet es sich in einem Google-Chat-Bereich. Melde dich bei {{ site_name }} an, um die Google-Chat-Integration einzurichten:'''

[[quelltext]]
datei = "hc/integrations/googlechat/templates/add_googlechat.html"
anzahl = 1
en = '''
From a browser, log into your Google Chat account, and go to the space
                where you want to post {% site_name %} notifications.'''
de = '''
Melde dich im Browser bei Google Chat an und öffne den Bereich, in dem {% site_name %} Benachrichtigungen posten soll.'''

[[quelltext]]
datei = "hc/integrations/googlechat/templates/add_googlechat.html"
anzahl = 1
en = '''
Next to the space title, click the down arrow, and then click <strong>Apps & integrations</strong>.'''
de = '''
Klick neben dem Namen des Bereichs auf den Pfeil nach unten und dann auf <strong>Apps & integrations</strong>.'''

[[quelltext]]
datei = "hc/integrations/googlechat/templates/add_googlechat.html"
anzahl = 1
en = '''
Click <strong>+ Add webhooks</strong>.'''
de = '''
Klick auf <strong>+ Add webhooks</strong>.'''

[[quelltext]]
datei = "hc/integrations/googlechat/templates/add_googlechat.html"
anzahl = 1
en = '''
In the <strong>Name</strong> field, enter
                <strong>{% site_name %}</strong>.'''
de = '''
Trag im Feld <strong>Name</strong> <strong>{% site_name %}</strong> ein.'''

[[quelltext]]
datei = "hc/integrations/googlechat/templates/add_googlechat.html"
anzahl = 1
en = '''
Click <strong>Save</strong>.'''
de = '''
Klick auf <strong>Save</strong>.'''

[[quelltext]]
datei = "hc/integrations/gotify/templates/gotify_form.html"
anzahl = 1
en = '''
is an open-source, self-hosted
        push notification service. If you use or plan on using Gotify,
        you can can integrate it with your {{ site_name }} account in few simple steps.'''
de = '''
ist ein selbst betriebener Open-Source-Dienst für Push-Benachrichtigungen. Nutzt du Gotify oder hast es vor, verbindest du es in wenigen Schritten mit deinem Konto bei {{ site_name }}.'''

[[quelltext]]
datei = "hc/integrations/gotify/templates/gotify_form.html"
anzahl = 1
en = '''
Log into your Gotify instance, go to
                    <strong>Apps</strong>, and create a new application.'''
de = '''
Melde dich bei deiner Gotify-Instanz an, öffne <strong>Apps</strong> und leg eine neue Anwendung an.'''

[[quelltext]]
datei = "hc/integrations/gotify/templates/gotify_form.html"
anzahl = 1
en = '''
Pick a descriptive name and short description.
                    After creating the app, you can also upload an icon for it
                    (feel free to use <a href="{% absolute_site_logo_url %}">this one</a>).'''
de = '''
Wähl einen aussagekräftigen Namen und eine kurze Beschreibung. Danach kannst du auch ein Symbol hochladen (gern <a href="{% absolute_site_logo_url %}">dieses</a>).'''

[[quelltext]]
datei = "hc/integrations/gotify/templates/gotify_form.html"
anzahl = 1
en = '''
After you have created the application, copy its
                    <strong>Token</strong>.'''
de = '''
Kopier danach das <strong>Token</strong> der Anwendung.'''

[[quelltext]]
datei = "hc/integrations/ntfy/templates/ntfy_form.html"
anzahl = 1
en = '''
is is a simple HTTP-based pub-sub
            notification service. If you use or plan on using ntfy,
            you can can integrate it with your {{ site_name }} account in few simple steps.'''
de = '''
ist ein einfacher Benachrichtigungsdienst nach dem Pub-Sub-Prinzip über HTTP. Nutzt du ntfy oder hast es vor, verbindest du es in wenigen Schritten mit deinem Konto bei {{ site_name }}.'''

[[quelltext]]
datei = "hc/integrations/ntfy/templates/ntfy_form.html"
anzahl = 1
en = '''
ntfy server's root URL, <em>without</em> the topic name.'''
de = '''
Grundadresse des ntfy-Servers, <em>ohne</em> den Namen des Themas.'''

[[quelltext]]
datei = "hc/integrations/github/templates/add_github.html"
anzahl = 1
en = '''
<p>With this integration, {% site_name %} will create an issue in your chosen
            GitHub repository when a check goes down.'''
de = '''
<p>Mit dieser Integration legt {% site_name %} ein Issue im gewählten GitHub-Repository an, wenn ein Check ausfällt.'''

[[quelltext]]
datei = "hc/integrations/github/templates/add_github_form.html"
anzahl = 1
en = '''
When a check goes down, {% site_name %} will create a new issue
                    in this repository.<br>
                    If you do not see the repository you are looking for,
                    make sure {% site_name %} GitHub app is installed
                    in the repository owner's GitHub account.
                    <a href="{{ install_url }}">Install…</a>'''
de = '''
Fällt ein Check aus, legt {% site_name %} in diesem Repository ein neues Issue an.<br>
                    Fehlt das gesuchte Repository, prüf, ob die GitHub-App von {% site_name %} im GitHub-Konto des Repository-Eigentümers installiert ist.
                    <a href="{{ install_url }}">Installieren…</a>'''

[[quelltext]]
datei = "hc/integrations/github/templates/add_github_form.html"
anzahl = 1
en = '''
{% site_name %} will attach these labels to the issues it creates.'''
de = '''
{% site_name %} versieht neue Issues mit diesen Labels.'''

[[quelltext]]
datei = "hc/integrations/spike/templates/add_spike.html"
anzahl = 1
en = '''
<p>If you are using <a href="https://spike.sh">Spike.sh</a>,
            you can set up {{ site_name }} to create a Spike.sh incident when a check
            goes down, and resolve it when a check goes back up.</p>'''
de = '''
<p>Nutzt du <a href="https://spike.sh">Spike.sh</a>, legt {{ site_name }} dort einen Incident an, wenn ein Check ausfällt, und schließt ihn, wenn der Check wieder in Ordnung ist.</p>'''

[[quelltext]]
datei = "hc/integrations/spike/templates/add_spike.html"
anzahl = 1
en = '''
Log into your Spike.sh account and go to
                    <strong>Integrations › New integration</strong>.
                    Select "Healthchecks" and click "Next".'''
de = '''
Melde dich bei Spike.sh an und öffne <strong>Integrations › New integration</strong>. Wähl „Healthchecks“ und klick auf „Next“.'''

[[quelltext]]
datei = "hc/integrations/spike/templates/add_spike.html"
anzahl = 1
en = '''
Give the integration a descriptive <strong>name</strong> and select
                    the Spike.sh <strong>service</strong> to add it to.'''
de = '''
Gib der Integration einen aussagekräftigen <strong>name</strong> und wähl den Spike.sh-<strong>service</strong>, zu dem sie gehört.'''

[[quelltext]]
datei = "hc/integrations/spike/templates/add_spike.html"
anzahl = 1
en = '''
In the following step, create or select an existing
                    <strong>escalation policy</strong> to associate with the
                    integration.'''
de = '''
Leg im nächsten Schritt eine <strong>escalation policy</strong> an oder wähl eine bestehende für die Integration.'''

[[quelltext]]
datei = "hc/integrations/spike/templates/add_spike.html"
anzahl = 1
en = '''
After you have created the integration, click on
                    <strong>Copy Webhook</strong>.'''
de = '''
Klick nach dem Anlegen auf <strong>Copy Webhook</strong>.'''

[[quelltext]]
datei = "hc/integrations/pagertree/templates/add_pagertree.html"
anzahl = 1
en = '''
<p>If your team uses <a href="https://pagertree.com">PagerTree</a>,
      you can set up {{ site_name }} to create a PagerTree alert when
      a check goes down, and resolve it when a check goes back up.</p>'''
de = '''
<p>Nutzt dein Team <a href="https://pagertree.com">PagerTree</a>, legt {{ site_name }} dort einen Alarm an, wenn ein Check ausfällt, und schließt ihn, wenn der Check wieder in Ordnung ist.</p>'''

[[quelltext]]
datei = "hc/integrations/pagertree/templates/add_pagertree.html"
anzahl = 1
en = '''
Log into your PagerTree account, navigate to the <a href="https://app.pagertree.com/integrations?direction=asc&limit=10&sort=tiny_id" target="_blank">Integrations page</a>.
                Then click the <strong>New Integration</strong> button and
                select the <strong>Healthchecks</strong> logo.'''
de = '''
Melde dich bei PagerTree an und öffne die <a href="https://app.pagertree.com/integrations?direction=asc&limit=10&sort=tiny_id" target="_blank">Integrations-Seite</a>. Klick dann auf <strong>New Integration</strong> und wähl das Logo von <strong>Healthchecks</strong>.'''

[[quelltext]]
datei = "hc/integrations/pagertree/templates/add_pagertree.html"
anzahl = 1
en = '''
In the New Integration Form, fill out the details with appropriate values. Then click the <strong>Create</strong> button.'''
de = '''
Füll das Formular „New Integration“ passend aus und klick auf <strong>Create</strong>.'''

[[quelltext]]
datei = "hc/integrations/pagertree/templates/add_pagertree.html"
anzahl = 1
en = '''
Copy the <strong>Endpoint URL</strong> and paste it
                in the form below.
                Save the integration, and you are done!'''
de = '''
Kopier die <strong>Endpoint URL</strong> und füge sie unten ein. Integration speichern, fertig.'''

[[quelltext]]
datei = "hc/integrations/opsgenie/templates/add_opsgenie.html"
anzahl = 1
en = '''
provides
    alerting, on-call scheduling, escalation policies, and incident tracking.
    You can integrate it with your {{ site_name }} account in a few
    simple steps.</p>'''
de = '''
bietet Alarmierung, Bereitschaftspläne, Eskalationsregeln und Incident-Tracking. Mit wenigen Schritten verbindest du es mit deinem Konto bei {{ site_name }}.</p>'''

[[quelltext]]
datei = "hc/integrations/opsgenie/templates/add_opsgenie.html"
anzahl = 1
en = '''
Log into your Opsgenie account,
                select a team, and go to the team's
                <strong>Integrations</strong> page and click
                <strong>Add integration</strong>.'''
de = '''
Melde dich bei Opsgenie an, wähl ein Team, öffne dessen Seite <strong>Integrations</strong> und klick auf <strong>Add integration</strong>.'''

[[quelltext]]
datei = "hc/integrations/opsgenie/templates/add_opsgenie.html"
anzahl = 1
en = '''
Select <strong>API</strong> in the grid of offered integration types.'''
de = '''
Wähl in der Übersicht der Integrationsarten <strong>API</strong>.'''

[[quelltext]]
datei = "hc/integrations/opsgenie/templates/add_opsgenie.html"
anzahl = 1
en = '''
<p>Copy the displayed API key, then click on
               <strong>Turn on integration</strong>.'''
de = '''
<p>Kopier den angezeigten API-Schlüssel und klick dann auf <strong>Turn on integration</strong>.'''

[[quelltext]]
datei = "hc/integrations/opsgenie/templates/add_opsgenie.html"
anzahl = 1
en = '''
<p>Paste the API key in the form below, and make sure the correct
                <strong>service region</strong> is selected.
                Save the integration, and you are done!'''
de = '''
<p>Füge den API-Schlüssel unten ein und prüf, ob die richtige <strong>Region</strong> gewählt ist. Integration speichern, fertig.'''

[[quelltext]]
datei = "hc/integrations/prometheus/templates/add_prometheus.html"
anzahl = 1
en = '''
provides a
          <a href="https://prometheus.io">Prometheus</a>-compatible metrics endpoint
          for each project. The endpoints are secured using each project's
          read-only API key.

          If your team uses Prometheus, you can configure it to scrape {{ site_name }}
          and have up-to-date check and tag status values available in Prometheus.'''
de = '''
bietet für jedes Projekt einen Endpunkt für Metriken im Format von <a href="https://prometheus.io">Prometheus</a>. Die Endpunkte sind mit dem API-Schlüssel (nur lesen) des Projekts geschützt. Nutzt dein Team Prometheus, kann es {{ site_name }} abfragen und hat die Zustände von Checks und Tags stets aktuell.'''

[[quelltext]]
datei = "hc/integrations/prometheus/templates/add_prometheus.html"
anzahl = 1
en = '''
Create a read-only API key in
                    <strong>Project Settings › API Access</strong>.
                </p>
                <p>
                    Note: make sure to use a <strong>read-only</strong> API key.
                    Prometheus does not need read-write API access.'''
de = '''
Leg unter <strong>Projekteinstellungen › API-Zugang</strong> einen API-Schlüssel (nur lesen) an. Nimm unbedingt einen Schlüssel <strong>nur zum Lesen</strong>; Prometheus braucht keinen Schreibzugriff.'''

[[quelltext]]
datei = "hc/integrations/prometheus/templates/add_prometheus.html"
anzahl = 1
en = '''
Edit Prometheus configuration and add a new section in the
                    <code>scrape_configs</code> section.'''
de = '''
Ergänze in der Konfiguration von Prometheus einen neuen Abschnitt unter <code>scrape_configs</code>.'''

[[quelltext]]
datei = "hc/integrations/prometheus/templates/add_prometheus.html"
anzahl = 1
en = '''
<strong>Note for Grafana Cloud users:</strong> Grafana Cloud
                    requires the metrics endpoints to be authenticated using either
                    HTTP "Basic" or "Bearer" authentication scheme. It refuses to
                    scrape public endpoints. To fulfil this requirement,
                    {% site_name %} provides an alternate metrics endpoint which
                    requires "Bearer" authentication. Use the following settings
                    with Grafana Cloud:'''
de = '''
<strong>Hinweis für Grafana Cloud:</strong> Grafana Cloud verlangt für Metrik-Endpunkte eine Anmeldung per HTTP „Basic“ oder „Bearer“ und fragt öffentliche Endpunkte nicht ab. Dafür bietet {% site_name %} einen zweiten Endpunkt mit „Bearer“-Anmeldung. Diese Einstellungen gelten für Grafana Cloud:'''

[[quelltext]]
datei = "hc/integrations/prometheus/templates/add_prometheus.html"
anzahl = 1
en = '''
Reload Prometheus' configuration. You should now start seeing
                {{ site_name }} data appear in Prometheus.'''
de = '''
Lade die Konfiguration von Prometheus neu. Danach erscheinen die Daten von {{ site_name }} in Prometheus.'''

[[quelltext]]
datei = "hc/integrations/shell/templates/add_shell.html"
anzahl = 1
en = '''
<p>Executes a local shell command when a check
        goes up or down.</p>'''
de = '''
<p>Führt einen Shell-Befehl auf dem Server aus, wenn ein Check ausfällt oder wieder in Ordnung ist.</p>'''

