de = '''
<p>Damit löschst du dein Konto bei {{ site_name }} endgültig.</p>'''

[[quelltext]]
datei = "templates/accounts/profile.html"
anzahl = 1
en = '''
You are about to leave the project <strong id="leave-project-name"></strong>.
                        You will lose access to its checks and integrations.'''
de = '''
Du verlässt gleich das Projekt <strong id="leave-project-name"></strong> und verlierst den Zugriff auf seine Checks und Integrationen.'''

[[quelltext]]
datei = "templates/accounts/project.html"
anzahl = 1
en = '''
This project has
                    <strong>{{ num_checks }} check{{ num_checks|pluralize}}</strong>,
                    but your account only has space for
                    <strong>{{ num_available }} additional check{{ num_available|pluralize }}</strong>.
                    To accept the transfer, please
                    <a href="{% url 'hc-billing' %}">upgrade your account first!</a>'''
de = '''
Das Projekt hat <strong>{{ num_checks }} {{ num_checks|pluralize:"Check,Checks" }}</strong>, in deinem Konto ist aber nur noch Platz für <strong>{{ num_available }} {{ num_available|pluralize:"weiteren Check,weitere Checks" }}</strong>. Um die Übertragung anzunehmen, <a href="{% url 'hc-billing' %}">wechsle zuerst in einen größeren Tarif</a>.'''

