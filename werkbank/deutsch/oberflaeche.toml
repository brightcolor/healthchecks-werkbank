# Oberfläche von Healthchecks: Vorlagen unter templates/ ohne Doku und Mails.
# Erzeugt aus einer Arbeitsliste; Änderungen direkt hier eintragen.
# Begriffe: Check, Ping, Badge, Tag, Slug bleiben; Period = Intervall; Grace Time = Kulanz;
# up/grace/down = in Ordnung/verspätet/ausgefallen. Du-Form, echte Umlaute.

